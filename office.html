<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>JARVIS Virtual Office</title>
<link rel='manifest' href='manifest.json'>
<link rel='icon' href='icon.svg'>
<meta name='theme-color' content='#0b1722'>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#0b1722;color:#dff;font-family:system-ui,sans-serif;min-height:100vh}
button{background:#0a4a6a;color:#dff;border:1px solid #3cf;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
button:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px;flex-wrap:wrap}
.top b{letter-spacing:2px}
#scene{position:relative;margin:0 10px;border:4px solid #0a2a40;border-radius:16px;overflow:hidden;background:#2b3a4a}
.wall{display:flex;justify-content:space-around;align-items:center;padding:10px;background:linear-gradient(#27506e,#1c3a52);border-bottom:6px solid #0a2a40}
.win{width:70px;height:44px;border:4px solid #e8f4ff;background:linear-gradient(#7fd4ff,#d8f3ff);border-radius:4px}
.sign{background:#fff;color:#0a3a55;font-weight:700;padding:6px 14px;border-radius:8px;letter-spacing:2px}
.mgr{margin:12px auto 4px;width:min(330px,92%);border:3px solid #7fd;border-radius:14px;background:rgba(120,220,255,.1);display:flex;justify-content:center;padding:6px 6px 12px;position:relative}
.mgr::before{content:'MANAGER OFFICE';position:absolute;top:-10px;left:14px;background:#0b1722;color:#7fd;font-size:10px;padding:0 6px;letter-spacing:2px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:14px;background:repeating-linear-gradient(90deg,#2f4256 0 40px,#34495e 40px 80px)}
.st{display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;padding-top:34px}
.bub{position:absolute;top:-2px;left:50%;transform:translateX(-50%);background:#fff;color:#123;border-radius:10px;padding:3px 8px;font-size:11px;max-width:140px;opacity:0;transition:opacity .2s;z-index:3;text-align:center}
.person{width:50px;height:60px;position:relative}
.head{width:28px;height:28px;border-radius:50%;position:absolute;left:11px;top:0;border:2px solid #222;background:radial-gradient(circle at 32% 55%,#222 1.6px,transparent 2.2px),radial-gradient(circle at 68% 55%,#222 1.6px,transparent 2.2px),var(--skin)}
.head::before{content:'';position:absolute;left:-2px;top:-5px;width:28px;height:14px;border-radius:14px 14px 4px 4px;background:var(--hair);border:2px solid #222}
.head::after{content:'';position:absolute;left:7px;bottom:4px;width:10px;height:5px;border-bottom:2px solid #a33;border-radius:0 0 10px 10px}
.body{position:absolute;left:5px;top:28px;width:40px;height:32px;border-radius:14px 14px 3px 3px;background:var(--c);border:2px solid #222}
.tie{position:absolute;left:22px;top:30px;width:6px;height:18px;background:#c0392b;clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}
.badge{position:absolute;right:-10px;top:-8px;font-size:16px}
.desk{width:100px;height:34px;background:#a0703a;border:2px solid #5a3a1a;border-radius:6px;margin-top:-18px;position:relative;z-index:2;display:flex;justify-content:center}
.mon{width:32px;height:20px;background:#0b2a3a;border:2px solid #222;border-radius:3px;margin-top:-14px;box-shadow:inset 0 0 6px #3cf}
.inb{position:absolute;right:5px;top:3px;font-size:15px}
.plate{margin-top:4px;font-size:12px;background:#0a3a55;padding:2px 8px;border-radius:6px;text-align:center}
.plate small{display:block;font-size:10px;opacity:.7}
.work .person{animation:bob .35s infinite}
.work .mon{box-shadow:0 0 12px #6df,inset 0 0 8px #6df}
@keyframes bob{50%{transform:translateY(-4px)}}
.bottom{display:flex;gap:10px;padding:10px;background:#16222e;border-top:6px solid #0a2a40;align-items:stretch}
#door{width:70px;text-align:center;font-size:30px;flex:none}
#door small{display:block;font-size:11px;letter-spacing:2px}
#tray{flex:1;min-height:92px;border:2px dashed #3cf;border-radius:10px;padding:8px;display:flex;gap:8px;overflow-x:auto;align-items:center}
#tray .lbl{font-size:11px;letter-spacing:2px;opacity:.7;writing-mode:vertical-rl;transform:rotate(180deg)}
.doc{min-width:120px;max-width:150px;text-align:left;font-size:12px;background:#0f3350}
.doc.fin{background:#0a6a45}
.fly{position:absolute;font-size:26px;transition:left .85s ease-in-out,top .85s ease-in-out;z-index:9;pointer-events:none}
.bar{display:flex;gap:8px;padding:12px 10px}
textarea,input[type=text],input[type=password]{flex:1;background:#04202f;color:#dff;border:1px solid #0a5a85;border-radius:8px;padding:12px;font-size:16px;min-width:0;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.box{background:#0f2231;border:2px solid #3cf;border-radius:14px;padding:16px;width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0}
pre{white-space:pre-wrap;font-family:inherit;margin:0;line-height:1.45}
.clog{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.m{padding:8px 12px;border-radius:10px;white-space:pre-wrap}.u{background:#0a3a55;align-self:flex-end}.j{background:#04202f;border:1px solid #0a4a6a}
.row{display:flex;gap:8px;flex-wrap:wrap}
a{color:#6df}
</style>
</head>
<body>
<div class='top'><b>🏢 JARVIS VIRTUAL OFFICE</b><div class='row'><button id='hire'>+ Hire employee</button><button id='cfgb'>Settings</button></div></div>
<div id='scene'>
<div class='wall'><div class='win'></div><div class='sign'>JARVIS &amp; CO.</div><div style='font-size:34px'>🕐</div><div class='win'></div></div>
<div class='mgr' id='mgr'></div>
<div class='floor' id='floor'></div>
<div class='bottom'><div id='door'>🚪<small>YOU</small></div><div id='tray'></div></div>
</div>
<div class='bar'><textarea id='goal' rows='2' placeholder='Give your manager a task, for example: Plan the launch of my consulting service with a 3-month budget'></textarea><button id='mk'>🎤</button><button id='go'>Assign to manager</button></div>
<div class='modal' id='md' hidden><div class='box' id='mb'></div></div>
<script>
const $=id=>document.getElementById(id);
const NL=String.fromCharCode(10);
const G='https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const DEF=[
{id:'jarvis',name:'Jarvis',emoji:'🤖',role:'Manager',prompt:'You are JARVIS, the manager of a virtual office. Witty, concise, address the user as sir.'},
{id:'analyst',name:'Ava',emoji:'📊',role:'Data Analyst',prompt:'You are Ava, a sharp data and business analyst. You find patterns, quantify, state assumptions and give clear recommendations.'},
{id:'acct',name:'Max',emoji:'💰',role:'Accountant',prompt:'You are Max, a meticulous accountant and financial planner. You handle budgets, costs, cash flow, tax basics and ROI. Show the numbers and flag risks.'},
{id:'mgr',name:'Priya',emoji:'📋',role:'Project Manager',prompt:'You are Priya, an experienced project manager. You break goals into milestones, owners, timelines, risks and next actions.'},
{id:'hr',name:'Sam',emoji:'👥',role:'HR Manager',prompt:'You are Sam, an HR manager. You handle hiring, onboarding, policies, performance and team culture.'},
{id:'res',name:'Leo',emoji:'🔎',role:'Researcher',prompt:'You are Leo, a thorough researcher. You gather key facts, compare options, note uncertainty and never invent sources.'},
{id:'write',name:'Mia',emoji:'✍',role:'Writer',prompt:'You are Mia, a professional writer. You draft clear emails, reports, posts and presentations.'},
{id:'strat',name:'Zane',emoji:'♟',role:'Strategist',prompt:'You are Zane, a business strategist. You weigh options and trade-offs, think long term, and challenge weak assumptions.'}];
let cfg=ld('jc',{}),notes=ld('jn',[]),S=ld('office',null);
if(!S||!S.agents||!S.agents.length)S={agents:DEF,chats:{}};
S.docs=S.docs||[];S.chats=S.chats||{};
const save=()=>{localStorage.setItem('office',JSON.stringify(S));localStorage.setItem('jc',JSON.stringify(cfg))};
const ag=id=>S.agents.find(a=>a.id==id)||S.agents[0];
const wait=ms=>new Promise(z=>setTimeout(z,ms));
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let SM={},working=false;
const SKIN=['#f5cba7','#e0ac69','#c68642','#8d5524'],HAIR=['#2c1b0e','#6b3e1e','#d4a017','#111','#a52a2a'],SUIT=['#2e86c1','#27ae60','#8e44ad','#e67e22','#16a085','#c0392b'];
function station(a,mgr){
const h=[...a.id].reduce((s,c)=>s+c.charCodeAt(0),0);
const d=el('div','st');d.style.setProperty('--skin',SKIN[h%4]);d.style.setProperty('--hair',HAIR[(h>>1)%5]);d.style.setProperty('--c',mgr?'#1b2631':SUIT[h%6]);
const b=el('div','bub');const p=el('div','person');
p.appendChild(el('div','head'));p.appendChild(el('div','body'));if(mgr)p.appendChild(el('div','tie'));p.appendChild(el('div','badge',a.emoji));
const dk=el('div','desk');dk.appendChild(el('div','mon'));
const o={st:d,bub:b,desk:dk};
if(mgr){o.inb=el('span','inb','📥');dk.appendChild(o.inb)}
const pl=el('div','plate',a.name);pl.appendChild(el('small','',a.role));
d.appendChild(b);d.appendChild(p);d.appendChild(dk);d.appendChild(pl);
d.onclick=()=>openChat(a.id);SM[a.id]=o;return d}
function renderOffice(){
SM={};$('mgr').innerHTML='';$('floor').innerHTML='';
S.agents.forEach((a,i)=>{if(i==0)$('mgr').appendChild(station(a,true));else $('floor').appendChild(station(a,false))})}
const bub=(id,t)=>{const o=SM[id];if(o){o.bub.textContent=t;o.bub.style.opacity=t?1:0}};
const work=(id,on)=>{const o=SM[id];if(o)o.st.classList.toggle('work',on)};
function fly(emoji,from,to){return new Promise(r=>{
const s=$('scene').getBoundingClientRect(),a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
const e=el('div','fly',emoji);
e.style.left=(a.left-s.left+a.width/2-13)+'px';e.style.top=(a.top-s.top+a.height/2-13)+'px';
$('scene').appendChild(e);
requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.left=(b.left-s.left+b.width/2-13)+'px';e.style.top=(b.top-s.top+b.height/2-13)+'px'}));
setTimeout(()=>{e.remove();r()},900)})}
async function llm(sys,msgs,json){
for(let i=0;i<4;i++){
const body={systemInstruction:{parts:[{text:sys}]},contents:msgs.map(m=>({role:m.role=='assistant'?'model':'user',parts:[{text:m.content}]}))};
if(json)body.generationConfig={responseMimeType:'application/json'};
const r=await fetch(G+cfg.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const j=await r.json();
if(j.error){if(r.status==429&&i<3){await wait(6000*(i+1));continue}throw new Error(j.error.message)}
return j.candidates[0].content.parts[0].text}}
const ctx=()=>' Today is '+new Date().toDateString()+'. Colleagues: '+S.agents.map(a=>a.name+' ('+a.role+')').join(', ')+'. Plain text only, no markdown, concise.';
function speak(t){if(cfg.mute||!window.speechSynthesis||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.slice(0,400));const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang=='en-GB')||vs.find(x=>x.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function modal(build){const b=$('mb');b.innerHTML='';build(b);$('md').hidden=false}
const closeM=()=>{$('md').hidden=true};
$('md').onclick=e=>{if(e.target==$('md'))closeM()};
function openSet(){modal(b=>{
b.appendChild(el('h3','','Settings'));
const p=el('div');p.appendChild(document.createTextNode('The team runs on a free Gemini key. '));
const a=el('a','','Create one here (no card)');a.href='https://aistudio.google.com/apikey';a.target='_blank';p.appendChild(a);p.appendChild(document.createTextNode(', paste it, press Save. It stays in this browser only.'));b.appendChild(p);
const k=el('input');k.type='password';k.placeholder='Paste Gemini API key';k.value=cfg.key||'';b.appendChild(k);
const l=el('label');const c=el('input');c.type='checkbox';c.checked=!!cfg.mute;l.appendChild(c);l.appendChild(document.createTextNode(' Mute voice'));b.appendChild(l);
const r=el('div','row');
const s=el('button','','Save');s.onclick=()=>{cfg.key=k.value.trim();cfg.mute=c.checked;save();closeM()};
const w=el('button','','Reset office');w.onclick=()=>{if(confirm('Reset the office, chats and deliverables?')){S={agents:DEF,chats:{},docs:[]};save();renderOffice();renderTray();closeM()}};
r.appendChild(s);r.appendChild(w);b.appendChild(r)})}
$('cfgb').onclick=openSet;
function openDoc(d){modal(b=>{
b.appendChild(el('h3','',d.title));b.appendChild(el('pre','',d.text));
const r=el('div','row');
const c=el('button','','Copy');c.onclick=()=>{navigator.clipboard.writeText(d.text);c.textContent='Copied'};
const dl=el('button','','Download');dl.onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([d.title+NL+NL+d.text],{type:'text/plain'}));a.download=d.title.replace(/[^a-z0-9]+/ig,'-')+'.txt';a.click()};
const x=el('button','','Close');x.onclick=closeM;
r.appendChild(c);r.appendChild(dl);r.appendChild(x);b.appendChild(r)})}
function renderTray(){
const t=$('tray');t.innerHTML='';t.appendChild(el('div','lbl','DELIVERABLES'));
if(!S.docs.length)t.appendChild(el('small','','Nothing yet. Assign a task above.'));
S.docs.slice(0,20).forEach(d=>{const b=el('button','doc'+(d.final?' fin':''),(d.final?'📦 ':'📄 ')+d.title);b.onclick=()=>openDoc(d);t.appendChild(b)})}
function addDoc(d){S.docs.unshift(Object.assign({id:Date.now()+Math.random(),ts:Date.now()},d));S.docs=S.docs.slice(0,60);save();renderTray()}
function openChat(id){const a=ag(id);modal(b=>{
b.appendChild(el('h3','',a.emoji+' '+a.name+' - '+a.role));
const log=el('div','clog');b.appendChild(log);
const add=(t,c)=>{log.appendChild(el('div','m '+c,t));log.scrollTop=log.scrollHeight};
const h=S.chats[id]=S.chats[id]||[];
if(!h.length)add('Hello sir, I am '+a.name+', your '+a.role+'. How can I help?','j');
h.forEach(m=>add(m.content,m.role=='user'?'u':'j'));
const r=el('div','row');const inp=el('input');inp.type='text';inp.placeholder='Message '+a.name;r.appendChild(inp);
const go=async()=>{const q=inp.value.trim();if(!q)return;inp.value='';add(q,'u');
if(!cfg.key){add('I need the free Gemini key first, sir. Close this and open Settings.','j');return}
h.push({role:'user',content:q});
try{const out=await llm(a.prompt+ctx(),h.slice(-14));h.push({role:'assistant',content:out});save();add(out,'j')}catch(e){h.pop();add('Problem: '+e.message,'j')}};
const s=el('button','','Send');s.onclick=go;inp.onkeydown=e=>{if(e.key=='Enter')go()};
r.appendChild(s);
if(id!='jarvis'){const f=el('button','','Dismiss');f.onclick=()=>{if(confirm('Dismiss '+a.name+'?')){S.agents=S.agents.filter(z=>z.id!=id);save();renderOffice();closeM()}};r.appendChild(f)}
const x=el('button','','Close');x.onclick=closeM;r.appendChild(x);b.appendChild(r)})}
$('hire').onclick=()=>{
const name=prompt('Name of the new employee?');if(!name)return;
const role=prompt('Job title? (for example Legal Advisor, Sales Lead, Site Engineer)');if(!role)return;
const ins=prompt('Anything special this person should know or do? (optional)')||'';
const em=['🧠','🛠','📈','⚖','🎯','🧪','🏗'][S.agents.length%7];
S.agents.push({id:'a'+Date.now(),name,emoji:em,role,prompt:'You are '+name+', a '+role+' in a virtual office. Act as a real expert in that field. '+ins});
save();renderOffice()};
async function assign(goal){
if(working||!goal)return;
if(!cfg.key){openSet();return}
working=true;$('go').disabled=true;$('goal').value='';
const team=S.agents.filter(a=>a.id!='jarvis'),M=SM.jarvis;
try{
bub('jarvis','Task received...');
await fly('📄',$('door'),M.inb);
work('jarvis',true);bub('jarvis','Planning the work...');
let plan={};
try{plan=JSON.parse(await llm('You are Jarvis, the manager. Pick 2 to 4 team members best suited to the task, in working order. Reply ONLY with JSON having keys: plan (one short sentence), agents (array of ids), asks (object mapping each id to what that person must deliver). Team: '+team.map(a=>a.id+'='+a.name+' the '+a.role).join('; '),[{role:'user',content:goal}],true))}catch(e){}
let ids=(plan.agents||[]).filter(i=>team.some(a=>a.id==i)).slice(0,4);
if(!ids.length)ids=team.slice(0,2).map(a=>a.id);
bub('jarvis',(plan.plan||'Delegating now.').slice(0,90));work('jarvis',false);
await Promise.all(ids.map(i=>fly('📄',M.desk,SM[i].desk)));
ids.forEach((i,n)=>bub(i,n?'Waiting for my turn':'Got it!'));
const parts=[];
for(const id of ids){
const a=ag(id);work(id,true);bub(id,'Working on it...');
const ask='Task: '+goal+' Your part: '+((plan.asks||{})[id]||'give your expert view')+(parts.length?' Colleagues so far: '+parts.map(p=>p.name+': '+p.text).join(' || '):'');
const text=await llm(a.prompt+' You are in a team meeting. Deliver your part in under 180 words, concrete and specific.'+ctx(),[{role:'user',content:ask}]);
work(id,false);bub(id,'Done!');parts.push({name:a.name,id,text});
await fly('📄',SM[id].desk,$('tray'));
addDoc({title:a.name+' ('+a.role+')',author:id,goal,text})}
work('jarvis',true);bub('jarvis','Compiling the final report...');
let fin={summary:'',tasks:[]};
try{fin=JSON.parse(await llm('You are Jarvis, the manager. Combine the team input into an executive summary under 120 words with a clear recommendation, and list 3 to 6 concrete action items. Reply ONLY with JSON having keys: summary (string), tasks (array of objects with title and owner, where owner is one of these ids: '+ids.join(', ')+', jarvis).',[{role:'user',content:'Task: '+goal+' Team input: '+parts.map(p=>p.name+': '+p.text).join(' || ')}],true))}catch(e){fin.summary=parts.map(p=>p.text).join(' ')}
work('jarvis',false);
const txt='TASK: '+goal+NL+NL+'EXECUTIVE SUMMARY'+NL+fin.summary+NL+NL+'ACTION ITEMS'+NL+(fin.tasks||[]).map((t,i)=>(i+1)+'. '+t.title+' ('+ag(t.owner).name+')').join(NL)+NL+NL+'TEAM INPUT'+NL+parts.map(p=>p.name+': '+p.text).join(NL+NL);
await fly('📦',M.desk,$('tray'));
addDoc({title:'FINAL REPORT - '+goal.slice(0,40),author:'jarvis',goal,text:txt,final:true});
bub('jarvis','Delivered, sir. Check the tray below.');ids.forEach(i=>bub(i,''));speak(fin.summary)
}catch(e){Object.keys(SM).forEach(k=>work(k,false));bub('jarvis','Problem: '+e.message.slice(0,80))}
working=false;$('go').disabled=false}
$('go').onclick=()=>assign($('goal').value.trim());
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mk').onclick=()=>{if(!SR){alert('Voice input needs Google Chrome or Edge.');return}
const r=new SR();r.lang='en-US';r.onresult=e=>{$('goal').value=e.results[0][0].transcript.trim();assign($('goal').value)};try{r.start()}catch(e){}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
renderOffice();renderTray();
bub('jarvis','Good day, sir. Give me a task.');
if(!cfg.key)openSet();
</script>
</body>
</html>
